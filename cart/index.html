<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="My Cart" />
<title>My Cart</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --surface-2: #efece5;
  --text: #1d1b20;
  --muted: #6d6873;
  --line: #e3dfd6;
  --accent: #4f46e5;
  --accent-ink: #ffffff;
  --accent-soft: #e8e6fc;
  --ok: #157f4a;
  --ok-soft: #dcf3e5;
  --warn: #a15c00;
  --warn-soft: #fbecd5;
  --danger: #c0352b;
  --shadow: 0 1px 2px rgba(30, 25, 20, .06), 0 4px 14px rgba(30, 25, 20, .06);
  --shadow-lift: 0 10px 30px rgba(30, 25, 20, .18);
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16151a;
    --surface: #211f26;
    --surface-2: #2a2830;
    --text: #f1eff4;
    --muted: #a19ca8;
    --line: #34313b;
    --accent: #8b85ff;
    --accent-ink: #14121a;
    --accent-soft: #2e2b4d;
    --ok: #5fd394;
    --ok-soft: #1d3a2a;
    --warn: #f0b259;
    --warn-soft: #3d2f1a;
    --danger: #ff7a6e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-lift: 0 12px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100dvh;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

/* Header */
header {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding-top: env(safe-area-inset-top);
}
.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; }
.top h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 0;
  background: var(--surface-2); display: grid; place-items: center;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:focus:not(:focus-visible) { outline: none; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 14px; margin-bottom: 12px; }
.tab { border: 0; background: transparent; padding: 10px 8px; border-radius: 10px; font-weight: 600; color: var(--muted); display: flex; gap: 6px; align-items: center; justify-content: center; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.count { font-size: 12px; min-width: 20px; padding: 1px 6px; border-radius: 99px; background: var(--line); color: var(--muted); font-weight: 600; }
.tab[aria-selected="true"] .count { background: var(--accent-soft); color: var(--accent); }

/* Budget card */
.budget {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px; margin: 4px 0 16px;
}
.budget-row { display: flex; align-items: center; gap: 10px; }
.budget label { font-size: 13px; color: var(--muted); font-weight: 600; }
.money-input { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 0 12px; }
.money-input span { color: var(--muted); font-weight: 600; }
.money-input input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; padding: 10px 0; font-size: 20px; font-weight: 700; outline: none; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.plan { margin-top: 12px; font-size: 14px; }
.plan-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.plan-head strong { font-size: 15px; }
.left { color: var(--ok); font-weight: 600; }
.left.neg { color: var(--danger); }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 10px 0 4px; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .3s; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.mode-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }

/* List */
.section-title { font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin: 8px 4px 8px; display: flex; justify-content: space-between; }
ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; align-items: stretch; gap: 0; position: relative;
  border: 1.5px solid transparent;
  transition: opacity .2s, border-color .2s;
}
.item.fits { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.item.out { opacity: .55; }
.item.dragging { z-index: 10; box-shadow: var(--shadow-lift); opacity: 1; transition: none; scale: 1.02; }
.handle {
  touch-action: none; border: 0; background: transparent; width: 44px; flex: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); cursor: grab;
}
.handle .rank { font-size: 12px; font-weight: 700; }
.handle svg { width: 18px; height: 18px; }
.item-main { flex: 1; min-width: 0; padding: 12px 0; }
.item-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.note { font-size: 13px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; padding: 10px 10px 10px 8px; gap: 6px; flex: none; }
.price { font-weight: 700; font-size: 16px; white-space: nowrap; }
.price small { display: block; text-align: right; font-weight: 500; font-size: 11px; color: var(--muted); }
.actions { display: flex; gap: 4px; }
.mini { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--surface-2); display: grid; place-items: center; color: var(--text); text-decoration: none; }
.mini svg { width: 17px; height: 17px; }
.mini.check { color: var(--ok); }

.empty { text-align: center; color: var(--muted); padding: 36px 16px; border: 1.5px dashed var(--line); border-radius: var(--radius); }
.empty strong { display: block; color: var(--text); margin-bottom: 4px; }

details.bought { margin-top: 20px; }
details.bought summary { list-style: none; cursor: pointer; }
details.bought summary::-webkit-details-marker { display: none; }
details.bought summary .section-title::after { content: "Show"; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--accent); }
details.bought[open] summary .section-title::after { content: "Hide"; }
.bought .item { opacity: .7; }
.bought .item-name { text-decoration: line-through; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 8px 4px; }

/* FAB */
.fab {
  position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6;
  height: 56px; padding: 0 22px 0 18px; border-radius: 18px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px;
  display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-lift);
}
.fab svg { width: 22px; height: 22px; }

/* Sheets */
dialog {
  border: 0; padding: 0; background: var(--surface); color: var(--text);
  width: 100%; max-width: 560px; border-radius: 22px 22px 0 0;
  margin: auto auto 0; max-height: 92dvh;
}
@media (min-width: 600px) { dialog { border-radius: 22px; margin: auto; } }
dialog::backdrop { background: rgba(10, 8, 15, .45); }
dialog[open] { animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet { padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.sheet h2 { margin: 0 0 14px; font-size: 19px; display: flex; justify-content: space-between; align-items: center; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 5px; }
.field input, .field textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px;
  padding: 11px 12px; outline: none; font-size: 16px;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 44px; }
.row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.list-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.list-pick label { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; display: block; cursor: pointer; }
.list-pick input { position: absolute; opacity: 0; pointer-events: none; }
.list-pick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.list-pick b { display: block; font-size: 15px; }
.list-pick small { color: var(--muted); font-size: 12px; }
.btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 700; width: 100%; background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btns { display: grid; gap: 8px; margin-top: 6px; }
.settings-list { display: grid; gap: 8px; }
.settings-list .btn { text-align: left; font-weight: 600; }
.store-guess { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 16px; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 10px 10px 10px 16px; border-radius: 14px;
  display: flex; gap: 12px; align-items: center; opacity: 0; pointer-events: none; transition: .2s; z-index: 20;
  max-width: calc(100% - 32px); font-size: 14px;
}
.toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
.toast button { border: 0; background: transparent; color: var(--accent); font-weight: 700; filter: brightness(1.3); padding: 4px 8px; }
@media (prefers-color-scheme: dark) { .toast button { filter: brightness(.7); } }

/* Lock */
.lock { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: none; place-items: center; padding: 24px; }
.lock.show { display: grid; }
.lock-box { width: 100%; max-width: 320px; text-align: center; }
.lock-box h2 { margin: 12px 0 18px; }
.lock-box input { width: 100%; text-align: center; font-size: 28px; letter-spacing: .4em; padding: 12px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); outline: none; margin-bottom: 12px; }
.lock-box .err { color: var(--danger); min-height: 20px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <h1>My Cart</h1>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="need">Must-buy <span class="count" id="countNeed">0</span></button>
      <button class="tab" role="tab" data-tab="want">Wishlist <span class="count" id="countWant">0</span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="budget" id="budgetCard">
    <div class="budget-row">
      <label for="budgetInput" id="budgetLabel">Budget</label>
      <div class="money-input">
        <span>₹</span>
        <input id="budgetInput" type="text" inputmode="numeric" placeholder="e.g. 2000" autocomplete="off" />
      </div>
    </div>
    <div class="plan" id="plan"></div>
  </section>

  <div class="section-title"><span id="listTitle">To buy</span><span id="listHint">Drag ⠿ to set priority</span></div>
  <ul class="list" id="list"></ul>

  <details class="bought" id="boughtWrap">
    <summary><div class="section-title"><span id="boughtTitle">Bought</span></div></summary>
    <ul class="list" id="boughtList"></ul>
    <button class="link-btn" id="clearBought">Clear bought items</button>
  </details>
</main>

<button class="fab" id="addBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Add item
</button>

<!-- Add / edit -->
<dialog id="itemDialog">
  <form class="sheet" id="itemForm" method="dialog">
    <h2><span id="itemDialogTitle">Add item</span>
      <button type="button" class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </h2>
    <div class="list-pick">
      <label><input type="radio" name="list" value="need" /><b>Must-buy</b><small>Groceries, daily needs</small></label>
      <label><input type="radio" name="list" value="want" /><b>Wishlist</b><small>Nice to have, within budget</small></label>
    </div>
    <label class="field"><span>Name</span><input name="name" required placeholder="e.g. Storage box" autocomplete="off" /></label>
    <div class="row2">
      <label class="field"><span>Price (₹)</span><input name="price" type="text" inputmode="decimal" placeholder="0" autocomplete="off" /></label>
      <label class="field"><span>Qty</span><input name="qty" type="number" inputmode="numeric" min="1" step="1" value="1" /></label>
    </div>
    <label class="field"><span>Link</span><input name="link" type="text" inputmode="url" placeholder="Paste Amazon / Flipkart / Meesho link" autocomplete="off" />
      <div class="store-guess" id="storeGuess"></div></label>
    <label class="field"><span>Note (optional)</span><textarea name="note" rows="1" placeholder="Size, colour, which one…"></textarea></label>
    <div class="btns">
      <button class="btn primary" type="submit" value="save">Save</button>
      <button class="btn danger" type="button" id="deleteItem" hidden>Delete item</button>
    </div>
  </form>
</dialog>

<!-- Settings -->
<dialog id="settingsDialog">
  <div class="sheet">
    <h2>Settings
      <button type="button" class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </h2>
    <div class="settings-list">
      <button class="btn" id="pinBtn">Set a PIN lock</button>
      <button class="btn" id="exportBtn">Download backup</button>
      <button class="btn" id="importBtn">Restore from backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
      <button class="btn danger" id="wipeBtn">Delete everything</button>
    </div>
    <p class="hint">Your list is saved only on this phone. Download a backup now and then so you don't lose it if you clear your browser data.</p>
  </div>
</dialog>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAction" hidden>Undo</button></div>

<div class="lock" id="lock">
  <form class="lock-box" id="lockForm">
    <img src="icon.svg" width="64" height="64" alt="" />
    <h2>My Cart</h2>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN" />
    <div class="err" id="pinErr"></div>
    <button class="btn primary" type="submit">Unlock</button>
  </form>
</div>

<script>
(() => {
  const KEY = 'mycart.v1';
  const $ = (s) => document.querySelector(s);

  // ---------- State ----------
  const defaults = { items: [], tab: 'need', budget: { need: '', want: '' }, mode: { need: 'fill', want: 'fill' }, pinHash: null };
  let state;
  try { state = Object.assign({}, defaults, JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch { state = { ...defaults }; }
  state.budget = Object.assign({ need: '', want: '' }, state.budget);
  state.mode = Object.assign({ need: 'fill', want: 'fill' }, state.mode);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const num = (v) => { const n = parseFloat(String(v ?? '').replace(/[^\d.]/g, '')); return isFinite(n) ? n : 0; };
  const inr = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
  const cost = (it) => num(it.price) * Math.max(1, parseInt(it.qty) || 1);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- Stores ----------
  const STORES = [
    [/amazon\.|amzn\./, 'Amazon', '#ff9900'], [/flipkart\.|fkrt\.|dl\.flipkart/, 'Flipkart', '#2874f0'],
    [/meesho\./, 'Meesho', '#e5307d'], [/myntra\.|myntr\.it/, 'Myntra', '#ff3f6c'], [/ajio\./, 'Ajio', '#2c4152'],
    [/nykaa/, 'Nykaa', '#fc2779'], [/blinkit\./, 'Blinkit', '#0c831f'], [/zepto/, 'Zepto', '#5a189a'],
    [/swiggy\./, 'Swiggy', '#fc8019'], [/bigbasket\.|bbassets/, 'BigBasket', '#84c225'], [/jiomart\./, 'JioMart', '#0078ad'],
    [/ikea\./, 'IKEA', '#0058a3'], [/tatacliq\./, 'Tata CLiQ', '#da1c5c'], [/firstcry\./, 'FirstCry', '#f58220'],
    [/pepperfry\./, 'Pepperfry', '#f16521'], [/croma\./, 'Croma', '#12daa8'], [/decathlon\./, 'Decathlon', '#0082c3'],
  ];
  const extractUrl = (s) => { const m = String(s || '').match(/https?:\/\/[^\s]+/i); return m ? m[0] : ''; };
  const normUrl = (s) => {
    s = String(s || '').trim(); if (!s) return '';
    const found = extractUrl(s); if (found) return found;
    if (/^[\w-]+(\.[\w-]+)+/.test(s)) return 'https://' + s;
    return s;
  };
  const storeOf = (url) => {
    if (!url) return null;
    let host; try { host = new URL(url).hostname.replace(/^www\.|^m\./, ''); } catch { return null; }
    for (const [re, name, color] of STORES) if (re.test(host)) return { name, color };
    return { name: host.split('.').slice(0, -1).join('.') || host, color: 'var(--muted)' };
  };

  // ---------- Budget plan ----------
  function plan(items, budget, mode) {
    const res = new Map(); let spent = 0; let stopped = false;
    for (const it of items) {
      const c = cost(it);
      if (!stopped && spent + c <= budget) { res.set(it.id, true); spent += c; }
      else { res.set(it.id, false); if (mode === 'strict') stopped = true; }
    }
    return { fits: res, spent };
  }

  // ---------- Render ----------
  const ICON = {
    grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  };

  function itemHTML(it, idx, fit, isBought) {
    const st = storeOf(it.link);
    const qty = Math.max(1, parseInt(it.qty) || 1);
    const hasPrice = num(it.price) > 0;
    let badge = '';
    if (!isBought && fit === true) badge = '<span class="chip ok">In budget</span>';
    else if (!isBought && fit === false) badge = '<span class="chip">Later</span>';
    if (!hasPrice && !isBought) badge += '<span class="chip warn">Add price</span>';
    return `<li class="item ${fit === true ? 'fits' : fit === false ? 'out' : ''}" data-id="${it.id}">
      ${isBought ? '<div style="width:14px"></div>' : `<button class="handle" aria-label="Drag to reorder"><span class="rank">${idx + 1}</span>${ICON.grip}</button>`}
      <div class="item-main" data-edit>
        <div class="item-name">${esc(it.name)}</div>
        <div class="meta">
          ${st ? `<span class="chip"><span class="dot" style="background:${st.color}"></span>${esc(st.name)}</span>` : ''}
          ${badge}
        </div>
        ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
      </div>
      <div class="item-side">
        <div class="price">${hasPrice ? inr(cost(it)) : '—'}${qty > 1 && hasPrice ? `<small>${qty} × ${inr(num(it.price))}</small>` : ''}</div>
        <div class="actions">
          ${it.link ? `<a class="mini" href="${esc(it.link)}" target="_blank" rel="noopener" aria-label="Open link">${ICON.link}</a>` : ''}
          <button class="mini ${isBought ? '' : 'check'}" data-toggle aria-label="${isBought ? 'Move back to list' : 'Mark as bought'}">${isBought ? ICON.undo : ICON.check}</button>
        </div>
      </div>
    </li>`;
  }

  function render() {
    const tab = state.tab;
    document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === tab));
    const pendingOf = (l) => state.items.filter((i) => i.list === l && !i.bought);
    $('#countNeed').textContent = pendingOf('need').length;
    $('#countWant').textContent = pendingOf('want').length;

    const pending = pendingOf(tab);
    const bought = state.items.filter((i) => i.list === tab && i.bought).sort((a, b) => (b.boughtAt || 0) - (a.boughtAt || 0));
    const budget = num(state.budget[tab]);
    const total = pending.reduce((s, i) => s + cost(i), 0);

    $('#budgetLabel').textContent = tab === 'need' ? 'This month' : 'I can spend';
    if (document.activeElement !== $('#budgetInput')) $('#budgetInput').value = state.budget[tab] ? Math.round(budget).toLocaleString('en-IN') : '';

    let fits = null;
    const planEl = $('#plan');
    if (budget > 0 && pending.length) {
      const p = plan(pending, budget, state.mode[tab]);
      fits = p.fits;
      const n = [...p.fits.values()].filter(Boolean).length;
      const left = budget - p.spent;
      const names = pending.filter((i) => p.fits.get(i.id)).map((i) => esc(i.name));
      planEl.innerHTML = `
        <div class="plan-head"><strong>You can buy ${n} of ${pending.length} item${pending.length > 1 ? 's' : ''}</strong>
          <span class="left">${inr(left)} left</span></div>
        <div class="bar"><i style="width:${Math.min(100, (p.spent / budget) * 100)}%"></i></div>
        <div class="hint">${n ? `${inr(p.spent)}: ${names.join(', ')}` : 'Nothing fits yet. Try a bigger budget or move a cheaper item up.'}</div>
        <div class="mode-row"><span class="hint" style="margin:0">${state.mode[tab] === 'fill' ? 'Skips items that don\'t fit and fills the rest' : 'Strictly in priority order; stops at the first item that doesn\'t fit'}</span>
          <div class="seg" role="group" aria-label="Plan mode">
            <button data-mode="fill" aria-pressed="${state.mode[tab] === 'fill'}">Fill budget</button>
            <button data-mode="strict" aria-pressed="${state.mode[tab] === 'strict'}">In order</button>
          </div></div>`;
    } else if (pending.length) {
      planEl.innerHTML = `<div class="plan-head"><strong>${pending.length} item${pending.length > 1 ? 's' : ''} · ${inr(total)} total</strong></div>
        <p class="hint">Type a budget to see what you can buy right now, in priority order.</p>`;
    } else {
      planEl.innerHTML = `<p class="hint" style="margin:0">Set a budget, then add items to see what fits.</p>`;
    }

    $('#listTitle').textContent = tab === 'need' ? 'Must-buy' : 'Wishlist';
    $('#listHint').textContent = pending.length > 1 ? 'Drag ⠿ to set priority' : '';
    $('#list').innerHTML = pending.length
      ? pending.map((it, i) => itemHTML(it, i, fits ? fits.get(it.id) : undefined, false)).join('')
      : `<li class="empty"><strong>${tab === 'need' ? 'Nothing on your must-buy list' : 'Your wishlist is empty'}</strong>
          ${tab === 'need' ? 'Add groceries and day-to-day things you have to buy.' : 'Add things you want, like a storage box, with a price and link.'}</li>`;

    const spent = bought.reduce((s, i) => s + cost(i), 0);
    $('#boughtWrap').hidden = !bought.length;
    $('#boughtTitle').textContent = `Bought (${bought.length}) · ${inr(spent)}`;
    $('#boughtList').innerHTML = bought.map((it, i) => itemHTML(it, i, undefined, true)).join('');
  }

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg, undo) {
    $('#toastMsg').textContent = msg;
    const btn = $('#toastAction');
    btn.hidden = !undo;
    btn.onclick = () => { undo && undo(); hideToast(); };
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 4500);
  }
  const hideToast = () => $('#toast').classList.remove('show');
  const snapshot = () => JSON.stringify(state.items);
  const restore = (snap) => () => { state.items = JSON.parse(snap); save(); render(); };

  // ---------- Events ----------
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => { state.tab = b.dataset.tab; save(); render(); }));

  $('#budgetInput').addEventListener('input', (e) => {
    const raw = e.target.value.replace(/[^\d]/g, '');
    state.budget[state.tab] = raw;
    save(); render();
  });
  // Only reformat the input on blur. Re-rendering here would swap out the button being tapped.
  $('#budgetInput').addEventListener('blur', (e) => {
    const b = num(state.budget[state.tab]);
    e.target.value = b ? Math.round(b).toLocaleString('en-IN') : '';
  });
  $('#budgetInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); });

  $('#plan').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mode]'); if (!b) return;
    state.mode[state.tab] = b.dataset.mode; save(); render();
  });

  function onListClick(e) {
    const li = e.target.closest('.item'); if (!li) return;
    const it = state.items.find((i) => i.id === li.dataset.id); if (!it) return;
    if (e.target.closest('[data-toggle]')) {
      const snap = snapshot();
      it.bought = !it.bought; it.boughtAt = it.bought ? Date.now() : null;
      if (!it.bought) { state.items = state.items.filter((i) => i !== it); state.items.push(it); }
      save(); render();
      toast(it.bought ? `Bought: ${it.name}` : `Moved back: ${it.name}`, restore(snap));
    } else if (e.target.closest('[data-edit]')) openItem(it);
  }
  $('#list').addEventListener('click', onListClick);
  $('#boughtList').addEventListener('click', onListClick);

  $('#clearBought').addEventListener('click', () => {
    const snap = snapshot();
    const n = state.items.filter((i) => i.list === state.tab && i.bought).length;
    state.items = state.items.filter((i) => !(i.list === state.tab && i.bought));
    save(); render(); toast(`Cleared ${n} item${n > 1 ? 's' : ''}`, restore(snap));
  });

  // ---------- Drag to reorder (touch + mouse) ----------
  const listEl = $('#list');
  let drag = null;
  listEl.addEventListener('pointerdown', (e) => {
    const h = e.target.closest('.handle'); if (!h) return;
    e.preventDefault();
    const li = h.closest('.item');
    h.setPointerCapture(e.pointerId);
    drag = { li, h, startY: e.clientY + scrollY, lastY: e.clientY, raf: 0 };
    li.classList.add('dragging');
    navigator.vibrate && navigator.vibrate(12);
    autoScroll();
  });
  function moveTo(clientY) {
    if (!drag) return;
    drag.lastY = clientY;
    const { li } = drag;
    let dy = clientY + scrollY - drag.startY;
    // Swap with a neighbour once we've moved past half the distance we'd travel by swapping,
    // so a swap never immediately triggers the reverse swap.
    for (let guard = 0; guard < 500; guard++) {
      const next = li.nextElementSibling, prev = li.previousElementSibling;
      if (dy > 0 && next && dy > (next.offsetTop + next.offsetHeight - li.offsetTop - li.offsetHeight) / 2) {
        const before = li.offsetTop; listEl.insertBefore(next, li); drag.startY += li.offsetTop - before;
      } else if (dy < 0 && prev && -dy > (li.offsetTop - prev.offsetTop) / 2) {
        const before = li.offsetTop; listEl.insertBefore(li, prev); drag.startY += li.offsetTop - before;
      } else break;
      dy = clientY + scrollY - drag.startY;
    }
    li.style.transform = `translateY(${dy}px)`;
    [...listEl.children].forEach((c, i) => { const r = c.querySelector('.rank'); if (r) r.textContent = i + 1; });
  }
  function autoScroll() {
    if (!drag) return;
    const y = drag.lastY, edge = 90;
    let v = 0;
    if (y < edge + 110) v = -Math.ceil((edge + 110 - y) / 8);
    else if (y > innerHeight - edge) v = Math.ceil((y - (innerHeight - edge)) / 8);
    if (v) { scrollBy(0, v); moveTo(y); }
    drag.raf = requestAnimationFrame(autoScroll);
  }
  listEl.addEventListener('pointermove', (e) => { if (drag) moveTo(e.clientY); });
  function endDrag() {
    if (!drag) return;
    cancelAnimationFrame(drag.raf);
    const order = [...listEl.querySelectorAll('.item')].map((li) => li.dataset.id);
    drag.li.classList.remove('dragging'); drag.li.style.transform = '';
    drag = null;
    const moved = order.map((id) => state.items.find((i) => i.id === id));
    const set = new Set(order);
    state.items = [...state.items.filter((i) => !set.has(i.id)), ...moved];
    save(); render();
  }
  listEl.addEventListener('pointerup', endDrag);
  listEl.addEventListener('pointercancel', endDrag);

  // ---------- Add / edit dialog ----------
  const dlg = $('#itemDialog'), form = $('#itemForm');
  let editing = null;
  function openItem(it, prefill) {
    editing = it || null;
    form.reset();
    $('#itemDialogTitle').textContent = it ? 'Edit item' : 'Add item';
    $('#deleteItem').hidden = !it;
    const d = it || Object.assign({ list: state.tab, qty: 1 }, prefill);
    form.list.value = d.list;
    form.name.value = d.name || '';
    form.price.value = d.price || '';
    form.qty.value = d.qty || 1;
    form.link.value = d.link || '';
    form.note.value = d.note || '';
    showStore();
    dlg.showModal();
    if (!it && !prefill) setTimeout(() => form.name.focus(), 50);
  }
  function showStore() {
    const st = storeOf(normUrl(form.link.value));
    $('#storeGuess').textContent = st ? `From ${st.name}` : '';
  }
  form.link.addEventListener('input', showStore);
  form.link.addEventListener('paste', () => setTimeout(() => {
    const raw = form.link.value, url = extractUrl(raw);
    if (url && url !== raw.trim()) {
      if (!form.name.value.trim()) form.name.value = cleanTitle(raw.replace(url, ''));
      form.link.value = url;
    }
    showStore();
  }));
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const data = {
      list: form.list.value || state.tab,
      name: form.name.value.trim(),
      price: form.price.value.trim() ? String(num(form.price.value)) : '',
      qty: Math.max(1, parseInt(form.qty.value) || 1),
      link: normUrl(form.link.value),
      note: form.note.value.trim(),
    };
    if (!data.name) { form.name.focus(); return; }
    if (editing) {
      const listChanged = editing.list !== data.list;
      Object.assign(editing, data);
      if (listChanged) { state.items = state.items.filter((i) => i !== editing); state.items.push(editing); }
    } else {
      state.items.push({ id: uid(), createdAt: Date.now(), bought: false, ...data });
      if (data.list !== state.tab) state.tab = data.list;
    }
    save(); render(); dlg.close();
    if (!editing) toast(`Added to ${data.list === 'need' ? 'Must-buy' : 'Wishlist'}. Drag it to set priority.`);
  });
  $('#deleteItem').addEventListener('click', () => {
    if (!editing) return;
    const snap = snapshot(), name = editing.name;
    state.items = state.items.filter((i) => i !== editing);
    save(); render(); dlg.close();
    toast(`Deleted: ${name}`, restore(snap));
  });
  $('#addBtn').addEventListener('click', () => openItem());

  document.querySelectorAll('dialog').forEach((d) => {
    d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
  });

  // ---------- Share from shopping apps (installed app on Android) ----------
  function cleanTitle(s) {
    return String(s || '')
      .replace(/^\s*(hey,?\s*)?(check out this|check this out|check out|look at this|i found this|have a look at this)\b\s*[:\-–]?\s*/i, '')
      .replace(/\s*(on|at|from)\s+(amazon|flipkart|meesho|myntra|ajio)[\w. ]*$/i, '')
      .replace(/\s+/g, ' ').trim().slice(0, 140);
  }
  (function handleShare() {
    const q = new URLSearchParams(location.search);
    if (!q.has('url') && !q.has('text') && !q.has('title')) return;
    const text = q.get('text') || '', title = q.get('title') || '';
    const link = q.get('url') || extractUrl(text) || extractUrl(title);
    const name = cleanTitle(title && !extractUrl(title) ? title : text.replace(link, ''));
    history.replaceState(null, '', location.pathname);
    const st = storeOf(link);
    const list = st && ['Blinkit', 'Zepto', 'Swiggy', 'BigBasket', 'JioMart'].includes(st.name) ? 'need' : 'want';
    window.__pendingShare = { name, link, list };
  })();

  // ---------- Settings ----------
  const sdlg = $('#settingsDialog');
  $('#settingsBtn').addEventListener('click', () => { $('#pinBtn').textContent = state.pinHash ? 'Remove PIN lock' : 'Set a PIN lock'; sdlg.showModal(); });
  $('#exportBtn').addEventListener('click', () => {
    const { pinHash, ...data } = state;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `my-cart-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.items)) throw 0;
      if (!confirm(`Replace your current list with ${data.items.length} items from the backup?`)) return;
      const pin = state.pinHash;
      state = Object.assign({}, defaults, data, { pinHash: pin });
      state.budget = Object.assign({ need: '', want: '' }, state.budget);
      state.mode = Object.assign({ need: 'fill', want: 'fill' }, state.mode);
      save(); render(); sdlg.close(); toast('Backup restored');
    } catch { alert("That file doesn't look like a My Cart backup."); }
    e.target.value = '';
  });
  $('#wipeBtn').addEventListener('click', () => {
    if (!confirm('Delete all items? This cannot be undone. (Download a backup first if unsure.)')) return;
    state.items = []; save(); render(); sdlg.close();
  });

  // ---------- PIN lock ----------
  async function hash(pin) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mycart:' + pin));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  $('#pinBtn').addEventListener('click', async () => {
    if (state.pinHash) {
      if (confirm('Remove the PIN lock?')) { state.pinHash = null; save(); sdlg.close(); toast('PIN removed'); }
      return;
    }
    const pin = prompt('Choose a 4–8 digit PIN'); if (pin == null) return;
    if (!/^\d{4,8}$/.test(pin)) { alert('Please use 4 to 8 digits.'); return; }
    const again = prompt('Type the PIN again'); if (again !== pin) { alert("PINs didn't match."); return; }
    state.pinHash = await hash(pin); save(); sdlg.close(); toast('PIN lock is on');
  });
  function afterUnlock() {
    $('#lock').classList.remove('show');
    if (window.__pendingShare) { const p = window.__pendingShare; window.__pendingShare = null; openItem(null, p); }
  }
  $('#lockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (await hash($('#pinInput').value) === state.pinHash) { $('#pinInput').value = ''; $('#pinErr').textContent = ''; afterUnlock(); }
    else { $('#pinErr').textContent = 'Wrong PIN'; $('#pinInput').select(); }
  });

  render();
  if (state.pinHash) { $('#lock').classList.add('show'); setTimeout(() => $('#pinInput').focus(), 50); }
  else afterUnlock();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
